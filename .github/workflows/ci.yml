name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        # si tienes reporters JUnit, puedes guardarlos aquí como artifact opcional

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start app (if your app needs to run)
        # Ajusta comando según cómo se inicie la app en ese repo (ej: npm start)
        run: |
          npm run start & 
          npx wait-on http://localhost:3000 -t 300000

      - name: Run Cypress tests (uses official cypress action)
        uses: cypress-io/github-action@53299cbe789c64daab823c4bfb1882d05e9feaf3
        with:
          browser: chrome
          start: npm run start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 300000
          run-tests: npm run cypress:run

      - name: Upload Cypress artifacts (screenshots & videos)
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results || ./cypress/results

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.tests=cypress,src
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.spec.js,**/*.test.ts,**/*.test.js"
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
